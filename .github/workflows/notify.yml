name: Notify Module Consumers

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notify:
    name: Notify Slack and Teams
    runs-on: ubuntu-latest

    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

    steps:
      - name: Notify Slack
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        run: |
          jq -n \
            --arg text "Terraform module published: ${{ github.repository }} ${{ github.event.release.tag_name }} - ${{ github.event.release.html_url }}" \
            '{text: $text}' \
          | curl -X POST -H 'Content-type: application/json' \
              --data @- \
              "$SLACK_WEBHOOK_URL"

      - name: Notify Microsoft Teams
        if: ${{ env.TEAMS_WEBHOOK_URL != '' }}
        run: |
          jq -n \
            --arg title "Terraform module published" \
            --arg text "Module: ${{ github.repository }} Version: ${{ github.event.release.tag_name }} URL: ${{ github.event.release.html_url }}" \
            '{title: $title, text: $text}' \
          | curl -X POST -H 'Content-type: application/json' \
              --data @- \
              "$TEAMS_WEBHOOK_URL"